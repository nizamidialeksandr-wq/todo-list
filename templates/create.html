{% extends "base.html" %}
{% block title %}Создать список{% endblock %}

{% block content %}
    <h1>Новый список</h1>

    <div class="content_center">
        <form action="{{ url_for('create') }}" method="post">
            <p>Название: <input type="text" name="name" required></p>
            <p>Описание: <input type="text" name="description" required></p>

            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                <button type="submit" class="button_submit">создать</button>
                <button type="button" class="button_submit"
                        onclick="window.location.href='{{ url_for('lists') }}';">Мои списки</button>
            </div>
        </form>
    </div>
{% endblock %}
