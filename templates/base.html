<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>{% block title %}Мой сайт{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="head">здесь будет шапка</div>
        <div class="page">
            <div class="menu">
                <ul>
                    <li>
                        <img src="https://cdn-icons-png.flaticon.com/128/1946/1946436.png" loading="lazy" alt="Дом" title="Дом" width="30" height="30">
                        <a class="{% if request.path == url_for('home') %}active{% endif %}" href="{{ url_for('home') }}">главная</a>
                    </li>
                    <li>
                        <img src="https://cdn-icons-png.flaticon.com/128/16016/16016600.png" loading="lazy" alt="create" title="create" width="30" height="30">
                        <a class="{% if request.path == url_for('create') %}active{% endif %}" href="{{ url_for('create') }}">Todo List</a>
                    </li>
                </ul>
            </div>
            <div class="content">{% block content %}{% endblock %}</div>
        </div>
        <div class="footer">здесь будет подвал</div>
    </body>
</html>
